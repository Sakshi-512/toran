{# Small inline icons in one line style. Decorative only: always aria-hidden. #}
{% macro icon(name, size=18) -%}
<svg class="icon" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{%- if name == "leaf" -%}
<path d="M5 19c0-8.3 5.7-14 14-14 0 8.3-5.7 14-14 14z"/><path d="M5 19l7.5-7.5"/>
{%- elif name == "clock" -%}
<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>
{%- elif name == "pin" -%}
<path d="M12 21s-6.5-6.1-6.5-11a6.5 6.5 0 0 1 13 0c0 4.9-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/>
{%- elif name == "chat" -%}
<path d="M4.3 19.7l1.3-3.9A8.3 8.3 0 1 1 8.4 18.6z"/><path d="M9.3 8.6c.2 2.9 2.6 5.3 5.5 5.6l1-1.3-1.7-1-.8.6a4.5 4.5 0 0 1-2.4-2.4l.6-.8-1-1.7z"/>
{%- elif name == "phone" -%}
<path d="M6.6 4.5h2.6l1.3 3.6-1.8 1.2a10 10 0 0 0 5.9 5.9l1.2-1.8 3.6 1.3v2.6a1.9 1.9 0 0 1-2 1.9A15.5 15.5 0 0 1 4.7 6.5a1.9 1.9 0 0 1 1.9-2z"/>
{%- endif -%}
</svg>
{%- endmacro %}
