[project]
name = "voice-site-agent"
version = "0.1.0"
requires-python = ">=3.12,<3.13"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "S", "SIM", "RUF", "C4", "PTH"]
ignore = [
    "B008",  # FastAPI uses Depends() in default arguments by design.
    "N818",  # Domain names like SpendCapReached read better than *Error.
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "scripts", "tests", "migrations/env.py"]

[[tool.mypy.overrides]]
module = ["limits.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:app.*"]
