name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      CLAUDE_MOCK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --require-hashes -r requirements-dev.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Commit hooks (lint, format, types, whitespace)
        # Same hooks as make lint and git commit. Secrets are scanned over full history below.
        run: SKIP=gitleaks .venv/bin/pre-commit run --all-files --show-diff-on-failure
      - name: Tests
        run: .venv/bin/pytest
      - name: Dependency audit
        run: .venv/bin/pip-audit --require-hashes --disable-pip -r requirements.txt

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
